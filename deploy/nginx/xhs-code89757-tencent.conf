# 腾讯云服务器上的 /etc/nginx/conf.d/xhs-poster-studio.conf
# 小红书封面生成器（xhs.code89757.com），纯静态，文件在 /var/www/xhs-poster-studio。
# 443 与同机其他站点共用，listen 参数保持一致（不加 http2）。
server {
    listen 80;
    server_name xhs.code89757.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name xhs.code89757.com;

    ssl_certificate /etc/letsencrypt/live/xhs.code89757.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xhs.code89757.com/privkey.pem;

    root /var/www/xhs-poster-studio;
    index index.html;

    # 字体约 15MB 而服务器带宽只有 5Mbps：压缩传输并长缓存，避免每次打开都重新下载
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript font/ttf image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(?:ttf|otf|woff2?)$ {
        types { font/ttf ttf; font/otf otf; font/woff woff; font/woff2 woff2; }
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
