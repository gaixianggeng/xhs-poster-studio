server {
    listen 127.0.0.1:18445 ssl proxy_protocol;
    server_name poster.code89757.com;

    ssl_certificate /etc/letsencrypt/live/poster.code89757.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poster.code89757.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:POSTER_SSL:10m;
    ssl_session_timeout 10m;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    root /var/www/xhs-poster-studio;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
